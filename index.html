<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Todo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1><span class="logo" aria-hidden="true"></span>Todo</h1>
      <p class="tagline">A tiny todo app. No build step, no dependencies.</p>
    </header>

    <form id="add-form">
      <input id="new-todo" type="text" placeholder="Add a new todo..." autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <footer>
      <a href="https://github.com/Ar4l/simple-todo-app">Source on GitHub</a>
      <span aria-hidden="true">&middot;</span>
      <a href="https://github.com/Ar4l/simple-todo-app/issues">Open issues</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
